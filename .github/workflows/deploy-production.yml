name: Deploy Production

on:
  # Documentation-only pushes are skipped: they change nothing the server runs,
  # and a rebuild on the single production box is not free.
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git ref to deploy on the server"
        required: true
        default: "origin/main"
      skip_public_health_check:
        description: "Skip public HTTPS health checks"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # An automatic deploy must not outrun the test suite, so this gates the deploy
  # job rather than relying on tests having passed earlier on the pull request.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment scripts
        run: |
          bash -n deploy/scripts/check_production_health.sh
          bash -n deploy/scripts/deploy_production.sh
          bash -n deploy/scripts/rollback_production.sh

      - name: Configure SSH key
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          test -n "$PRODUCTION_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/production_deploy_key
          chmod 600 ~/.ssh/production_deploy_key

      - name: Deploy over SSH
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_SSH_KEY_PATH: /home/runner/.ssh/production_deploy_key
          # A push-triggered run has no inputs, so these fall back to deploying
          # main with the public health checks enabled.
          DEPLOY_REF: ${{ inputs.deploy_ref || 'origin/main' }}
          JOBLENS_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          JOBLENS_HEALTH_BASE_URL: ${{ secrets.PRODUCTION_HEALTH_BASE_URL }}
          SKIP_PUBLIC_HEALTH_CHECK: ${{ inputs.skip_public_health_check || 'false' }}
        run: |
          if [ -z "$DEPLOY_SSH_PORT" ]; then
            export DEPLOY_SSH_PORT=22
          fi

          deploy/scripts/deploy_production.sh

      - name: Roll back on deployment failure
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_SSH_KEY_PATH: /home/runner/.ssh/production_deploy_key
          JOBLENS_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          JOBLENS_HEALTH_BASE_URL: ${{ secrets.PRODUCTION_HEALTH_BASE_URL }}
          SKIP_PUBLIC_HEALTH_CHECK: ${{ inputs.skip_public_health_check || 'false' }}
        run: |
          if [ -z "$DEPLOY_SSH_PORT" ]; then
            export DEPLOY_SSH_PORT=22
          fi

          deploy/scripts/rollback_production.sh

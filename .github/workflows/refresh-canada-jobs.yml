name: Refresh Canada Jobs Snapshot

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch the deploy workflow after the snapshot merges.
  actions: write

concurrency:
  group: refresh-canada-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Groq configuration
        id: groq_config
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Canada Jobs Refresh Skipped"
              echo
              echo "The refresh workflow requires the \`GROQ_API_KEY\` repository secret."
              echo "Add the secret to enable weekly Groq-enriched snapshot refresh pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Enrichment is the expensive half of this job and the account allows
      # 200,000 Groq tokens a day, which one full run very nearly spends. A
      # run that enriches every posting and then fails a later gate used to
      # throw all of it away with the runner, so each retry paid full price
      # and a second attempt the same day could not finish at all.
      #
      # The build reuses any posting whose clean_description is unchanged and
      # checkpoints to its output path after every one, so carrying that file
      # between runs turns a retry into a handful of calls for the postings
      # that actually moved.
      - name: Restore the last enriched candidate
        if: steps.groq_config.outputs.configured == 'true'
        uses: actions/cache/restore@v6
        with:
          path: /tmp/extraction-cache
          # Unique per run so each one saves its own, with the prefix falling
          # back to the most recent earlier candidate.
          key: canada-snapshot-candidate-${{ github.run_id }}
          restore-keys: |
            canada-snapshot-candidate-

      - name: Fetch and enrich current Canadian jobs
        if: steps.groq_config.outputs.configured == 'true'
        run: |
          mkdir -p /tmp/extraction-cache

          # Seed the output path with whatever already holds extractions for
          # these postings. A restored candidate is preferred over the
          # committed snapshot because it is newer and was itself seeded
          # from it, so it can only ever cover more.
          if [ -f /tmp/extraction-cache/canada_jobs_snapshot.csv ]; then
            echo "Reusing extractions from an earlier run's candidate."
          else
            echo "No candidate cached; seeding from the committed snapshot."
            cp data/processed/canada_jobs_snapshot.csv \
              /tmp/extraction-cache/canada_jobs_snapshot.csv
          fi

          python scripts/fetch_canada_jobs.py \
            --output-path /tmp/canada_jobs.csv \
            --summary-path /tmp/canada-fetch-summary.json \
            --summary-markdown-path /tmp/canada-fetch-summary.md
          python scripts/build_canada_jobs_snapshot.py \
            --input-path /tmp/canada_jobs.csv \
            --output-path /tmp/extraction-cache/canada_jobs_snapshot.csv \
            --delay-seconds 1 \
            --summary-path /tmp/canada-build-summary.json \
            --summary-markdown-path /tmp/canada-build-summary.md

      # Saved even when enrichment itself failed: the build checkpoints after
      # each posting, so a run that died partway still has real work to hand
      # the next one.
      - name: Keep the enriched candidate for the next run
        if: always() && steps.groq_config.outputs.configured == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/extraction-cache
          key: canada-snapshot-candidate-${{ github.run_id }}

      - name: Validate refreshed snapshot
        if: steps.groq_config.outputs.configured == 'true'
        run: |
          python scripts/validate_canada_jobs_snapshot.py \
            --candidate-path /tmp/extraction-cache/canada_jobs_snapshot.csv \
            --baseline-path data/processed/canada_jobs_snapshot.csv \
            --summary-path /tmp/snapshot-quality.md
          cp /tmp/extraction-cache/canada_jobs_snapshot.csv \
            data/processed/canada_jobs_snapshot.csv

      # Runs even when the gate above stopped the job, so the run's own
      # summary names which gate was missed and by how much. Until this
      # existed the numbers lived only in the raw log, and ten consecutive
      # failures looked identical from the notification email.
      - name: Publish snapshot quality summary
        if: always() && steps.groq_config.outputs.configured == 'true'
        run: |
          if [ -f /tmp/snapshot-quality.md ]; then
            cat /tmp/snapshot-quality.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run test suite
        if: steps.groq_config.outputs.configured == 'true'
        run: python -m pytest -q

      - name: Detect snapshot changes
        id: changes
        if: steps.groq_config.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data/processed/canada_jobs_snapshot.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create refresh branch and commit
        if: steps.groq_config.outputs.configured == 'true' && steps.changes.outputs.changed == 'true'
        env:
          BRANCH_NAME: automation/canada-jobs-refresh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add data/processed/canada_jobs_snapshot.csv
          git commit -m "refresh canada jobs snapshot"
          git push origin "$BRANCH_NAME"

      - name: Build pull request summary
        if: steps.groq_config.outputs.configured == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "## Summary"
            echo
            echo "Refreshed the committed Canada jobs snapshot from first-party employer boards."
            echo
            echo "- Fetched current Canadian technical postings from the configured Greenhouse, Lever, and Ashby boards."
            echo "- Reused Groq skill extractions for unchanged descriptions and re-extracted changed or new postings."
            echo "- Applied role, employer, location, source, freshness, and extraction quality gates."
            echo
            cat /tmp/canada-fetch-summary.md
            echo
            cat /tmp/canada-build-summary.md
            echo
            cat /tmp/snapshot-quality.md
            echo "## Testing"
            echo
            echo "- Ran the full \`pytest\` suite successfully in GitHub Actions."
          } > /tmp/pull-request.md

      - name: Open snapshot refresh pull request
        if: steps.groq_config.outputs.configured == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/canada-jobs-refresh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Refresh Canada jobs snapshot" \
            --body-file /tmp/pull-request.md

      # Safe to merge unattended because the snapshot only reaches this point
      # after validate_canada_jobs_snapshot.py and the full pytest suite have
      # already passed above. The pull request remains the audit trail and the
      # revert handle. Nothing is waiting on required checks, so this merges now.
      - name: Merge the snapshot refresh pull request
        if: steps.groq_config.outputs.configured == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/canada-jobs-refresh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh pr merge "$BRANCH_NAME" --squash --delete-branch

      # A merge performed with GITHUB_TOKEN does not raise a push event, so the
      # deploy workflow would never see the new snapshot. workflow_dispatch is
      # one of the two events the token is allowed to trigger, so request the
      # deploy explicitly. Without this the refreshed data sits in main until
      # some later code change happens to deploy it.
      - name: Deploy the refreshed snapshot
        if: steps.groq_config.outputs.configured == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-production.yml \
            --ref main \
            -f deploy_ref=origin/main \
            -f skip_public_health_check=false

name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit

      - name: Run dependency and static scans
        run: |
          SECURITY_SCAN_REPORT_DIR=deploy/security-reports \
          RUN_TRIVY_IMAGE_SCAN=false \
          deploy/scripts/run_security_scans.sh

      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: deploy/security-reports
          if-no-files-found: ignore

  container-security:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build -t joblens-security-scan:${{ github.sha }} .

      - name: Scan application image
        run: |
          mkdir -p deploy/security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/deploy/security-reports:/reports" \
            aquasec/trivy:latest \
            image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format json \
            --output /reports/trivy-image.json \
            joblens-security-scan:${{ github.sha }}

      - name: Upload container security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-report
          path: deploy/security-reports/trivy-image.json
          if-no-files-found: ignore

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JobLens Operations Login</title>
    <style>
      body {
        align-items: center;
        background: #f6f8fb;
        color: #142033;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: white;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        max-width: 360px;
        padding: 28px;
        width: 100%;
      }

      label {
        display: block;
        font-weight: 700;
        margin-top: 16px;
      }

      input {
        border: 1px solid #b8c4d4;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
        margin-top: 6px;
        padding: 10px;
        width: 100%;
      }

      button {
        background: #0f5f6f;
        border: 0;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        margin-top: 20px;
        padding: 11px 14px;
        width: 100%;
      }

      .error {
        background: #fff2f2;
        border: 1px solid #f0b8b8;
        border-radius: 6px;
        color: #7a1e1e;
        margin-top: 16px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Operations Login</h1>
      {% if form.errors %}
        <div class="error">Invalid username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>

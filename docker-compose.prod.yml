name: joblens-production

x-app-build: &app-build
  context: .

x-app-env: &app-env
  PYTHONPATH: /app
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  JOBLENS_API_ROOT_PATH: ${JOBLENS_API_ROOT_PATH:-/api}
  JOBLENS_CORS_ORIGINS: ${JOBLENS_CORS_ORIGINS:?JOBLENS_CORS_ORIGINS must be set}
  JOBLENS_RATE_LIMIT_ENABLED: ${JOBLENS_RATE_LIMIT_ENABLED:-true}
  JOBLENS_ANALYZE_RATE_LIMIT: ${JOBLENS_ANALYZE_RATE_LIMIT:-60}
  JOBLENS_RATE_LIMIT_WINDOW_SECONDS: ${JOBLENS_RATE_LIMIT_WINDOW_SECONDS:-60}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      JOBLENS_DOMAIN: ${JOBLENS_DOMAIN:?JOBLENS_DOMAIN must be set}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      django-ops:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    image: joblens-frontend:${JOBLENS_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Server-side only. The browser never sees this, so the API needs no
      # public hostname and stays reachable over the Docker network.
      JOBLENS_API_URL: ${JOBLENS_API_URL:-http://api:8000}
    expose:
      - "3000"
    # Only the edge network: the Node process reaches PostgreSQL through the
    # API, never directly.
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/proxy/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build: *app-build
    image: joblens-app:${JOBLENS_IMAGE_TAG:-latest}
    command: >
      gunicorn src.api.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers ${API_WORKERS:-2}
      --timeout 120
    restart: unless-stopped
    environment: *app-env
    expose:
      - "8000"
    networks:
      - edge
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  django-ops:
    build: *app-build
    image: joblens-app:${JOBLENS_IMAGE_TAG:-latest}
    command: >
      gunicorn django_ops.config.wsgi:application
      --bind 0.0.0.0:8001
      --workers ${DJANGO_WORKERS:-2}
      --timeout 120
    restart: unless-stopped
    environment:
      <<: *app-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS must be set}
      DJANGO_SESSION_COOKIE_SECURE: "true"
      DJANGO_CSRF_COOKIE_SECURE: "true"
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SESSION_COOKIE_AGE: ${DJANGO_SESSION_COOKIE_AGE:-28800}
    expose:
      - "8001"
    networks:
      - edge
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  edge:
    name: joblens_edge
  database:
    name: joblens_database
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

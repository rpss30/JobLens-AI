[pytest]
testpaths = tests
addopts = -ra --strict-markers
DJANGO_SETTINGS_MODULE = django_ops.config.test_settings
pythonpath = .
markers =
    unit: fast deterministic tests for isolated business rules and pure transformations
    contract: API, provider, or external-boundary contract tests with controlled fixtures
    integration: tests that exercise multiple JobLens components together
    db: tests that require a real database behavior boundary
    e2e: small critical workflow tests that cross application boundaries
    slow: tests that are expected to be slower than the normal development slice
